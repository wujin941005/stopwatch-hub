name: Firmware tests

on:
  push:
    paths:
      - ".github/workflows/firmware-core-tests.yml"
      - "firmware/app_codex/**"
      - "firmware/app_printsphere/**"
      - "firmware/hub_time/**"
      - "firmware/hub_wifi/**"
      - "firmware/printsphere_core/**"
      - "scripts/install_firmware.sh"
      - "scripts/prepare_printsphere_port.py"
      - "tests/test_printsphere_port.py"
      - "tests/printsphere_core_smoke.cpp"
      - "vendor/PrintSphere"
  pull_request:
    paths:
      - ".github/workflows/firmware-core-tests.yml"
      - "firmware/app_codex/**"
      - "firmware/app_printsphere/**"
      - "firmware/hub_time/**"
      - "firmware/hub_wifi/**"
      - "firmware/printsphere_core/**"
      - "scripts/install_firmware.sh"
      - "scripts/prepare_printsphere_port.py"
      - "tests/test_printsphere_port.py"
      - "tests/printsphere_core_smoke.cpp"
      - "vendor/PrintSphere"

permissions:
  contents: read

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Validate PrintSphere materialization and firmware policies
        run: python3 -m unittest discover -s tests -p 'test_printsphere_port.py' -v
      - name: Build hardware-independent core smoke test
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pthread
          -Ifirmware/printsphere_core/include
          firmware/printsphere_core/src/printer_state.cpp
          firmware/printsphere_core/src/bambu_status.cpp
          tests/printsphere_core_smoke.cpp
          -o /tmp/printsphere_core_smoke
      - name: Run smoke test
        run: /tmp/printsphere_core_smoke
